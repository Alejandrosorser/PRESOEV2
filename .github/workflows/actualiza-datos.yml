name: Actualiza datos de PRESOE

on:
  schedule:
    - cron: "0 6 * * *"  # Se ejecuta cada día a las 6:00 UTC (8:00 hora española peninsular)
  workflow_dispatch:    # Permite también ejecución manual desde la pestaña Actions

jobs:

  actualiza_datos:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configura Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instala dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecuta el script de actualización
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: python scripts/actualiza_datos.py

    - name: Haz commit y push de los datos actualizados
      run: |
        git config --global user.email "robot@presoe.com"
        git config --global user.name "Robot PRESOE"
        git add datos.js
        git commit -m "Actualiza datos - `date +'%Y-%m-%d'`" || echo "No hay cambios"
        git push
