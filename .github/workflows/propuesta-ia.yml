name: Actualización diaria con IA

on:
  schedule:
    - cron: "30 6 * * *"   # media hora después del robot del ticker
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: datos-js
  cancel-in-progress: false

jobs:
  propuesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generar actualización con IA
        id: ia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/propuesta_ia.py

      - name: Publicar en la web los cambios no sensibles
        if: steps.ia.outputs.publicar == 'true'
        run: |
          git config user.name "presoe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos.js
          git commit -m "Actualización IA $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preparar cambios sensibles para revisión
        if: steps.ia.outputs.revisar == 'true'
        run: mv datos_propuesta.js datos.js

      - name: Abrir Pull Request con los cambios sensibles
        if: steps.ia.outputs.revisar == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: propuesta-ia
          base: main
          title: "Cambios sensibles pendientes de revisión"
          body-path: cambios_pr.md
          commit-message: "Propuesta IA: cambios sensibles en datos.js"
          add-paths: datos.js
          delete-branch: true
