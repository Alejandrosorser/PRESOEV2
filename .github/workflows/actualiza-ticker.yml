name: Actualiza ticker (titulares)

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 08:00 en Madrid (horario de verano)
  workflow_dispatch:       # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refrescar titulares
        run: python scripts/actualiza_ticker.py

      - name: Publicar cambios
        run: |
          git config user.name "presoe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos.js
          git commit -m "Ticker automático $(date -u +%F)" || echo "Sin cambios que publicar"
          git push
